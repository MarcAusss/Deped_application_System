<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="SDO Albay CARES">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6DB78"/>
      <stop offset="0.45" stop-color="#C8961A"/>
      <stop offset="0.7" stop-color="#F0CF5E"/>
      <stop offset="1" stop-color="#A97A0E"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#25804F"/>
      <stop offset="1" stop-color="#14402A"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7EC6EA"/>
      <stop offset="0.65" stop-color="#D7EFF8"/>
      <stop offset="1" stop-color="#F4FAF6"/>
    </linearGradient>
    <linearGradient id="volcano" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#58799E"/>
      <stop offset="0.55" stop-color="#3F7F78"/>
      <stop offset="1" stop-color="#2E7D4F"/>
    </linearGradient>
    <linearGradient id="hills" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5DB66A"/>
      <stop offset="1" stop-color="#1E6B42"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF4C2"/>
      <stop offset="0.5" stop-color="#F2C230"/>
      <stop offset="1" stop-color="#D49A12"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF6CF"/>
      <stop offset="0.55" stop-color="#FFE58A"/>
      <stop offset="1" stop-color="#FFE58A" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="scene"><circle cx="120" cy="120" r="82"/></clipPath>
    <path id="arcTop" d="M31 120 A89 89 0 0 1 209 120"/>
    <path id="arcBottom" d="M22 120 A98 98 0 0 0 218 120"/>
  </defs>

  <!-- rim and band -->
  <circle cx="120" cy="120" r="118" fill="url(#gold)" stroke="#8A6510" stroke-width="0.8"/>
  <circle cx="120" cy="120" r="111" fill="#FFFFFF"/>
  <circle cx="120" cy="120" r="108" fill="url(#band)"/>
  <circle cx="120" cy="120" r="86" fill="url(#gold)"/>

  <text font-family="'Arial Black','Segoe UI Black',Arial,sans-serif" font-weight="900" font-size="15" letter-spacing="4" fill="#FFFFFF" text-anchor="middle">
    <textPath href="#arcTop" startOffset="50%">SDO ALBAY</textPath>
  </text>
  <text font-family="'Segoe UI',Arial,sans-serif" font-weight="700" font-size="9.8" letter-spacing="1" fill="#FFFFFF" text-anchor="middle">
    <textPath href="#arcBottom" startOffset="50%">DEPARTMENT OF EDUCATION</textPath>
  </text>
  <path d="M24 114 L25.8 119 L31 119 L26.8 122 L28.4 127 L24 124 L19.6 127 L21.2 122 L17 119 L22.2 119 Z" fill="#F2C230"/>
  <path d="M216 114 L217.8 119 L223 119 L218.8 122 L220.4 127 L216 124 L211.6 127 L213.2 122 L209 119 L214.2 119 Z" fill="#F2C230"/>

  <!-- scene -->
  <g clip-path="url(#scene)">
    <rect x="30" y="30" width="180" height="180" fill="url(#sky)"/>
    <circle cx="160" cy="70" r="22" fill="url(#sun)"/>
    <circle cx="160" cy="70" r="10" fill="#FFE071"/>
    <g fill="#FFFFFF" opacity="0.95">
      <ellipse cx="74" cy="74" rx="14" ry="6"/>
      <ellipse cx="84" cy="70" rx="10" ry="7"/>
      <ellipse cx="174" cy="96" rx="12" ry="5"/>
      <ellipse cx="182" cy="92" rx="8" ry="5.5"/>
    </g>
    <path d="M30 150 Q76 128 118 140 T210 136 L210 210 L30 210 Z" fill="#8FCB98"/>
    <path d="M50 152 C78 134 98 104 112 78 Q120 64 128 78 C142 104 162 134 190 152 Z" fill="url(#volcano)"/>
    <path d="M120 66 C126 72 140 104 150 122 C162 138 176 148 190 152 L120 152 Z" fill="#0B2A1B" opacity="0.14"/>
    <path d="M112 78 Q120 64 128 78 L125 86 L121 81 L117 88 L114 83 Z" fill="#F1F6FA"/>
    <g fill="#E9EEF1" opacity="0.9">
      <ellipse cx="127" cy="57" rx="7" ry="4"/>
      <ellipse cx="134" cy="52" rx="6" ry="3.5"/>
    </g>
    <path d="M30 160 Q120 138 210 160 L210 210 L30 210 Z" fill="url(#hills)"/>
    <path d="M62 132 Q100 118 138 96" fill="none" stroke="#F2C230" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="0.1 6"/>
    <path d="M131 94 L141 94 L139 104" fill="none" stroke="#F2C230" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="120" cy="70" rx="70" ry="34" fill="#FFFFFF" opacity="0.12"/>
  </g>

  <!-- title -->
  <text x="120" y="153" text-anchor="middle" font-family="'Arial Black','Segoe UI Black',Arial,sans-serif" font-weight="900" font-size="38" textLength="150" lengthAdjust="spacingAndGlyphs" fill="url(#title)" stroke="#123823" stroke-width="5" stroke-linejoin="round" paint-order="stroke fill">CARES</text>

  <!-- ribbon -->
  <path d="M50 162 L60 162 L60 180 L50 180 L54 171 Z" fill="#0E2F1E"/>
  <path d="M190 162 L180 162 L180 180 L190 180 L186 171 Z" fill="#0E2F1E"/>
  <rect x="58" y="159" width="124" height="20" rx="2" fill="#1E6B42" stroke="url(#gold)" stroke-width="1.4"/>
  <text x="120" y="167.3" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-weight="800" font-size="6.1" letter-spacing="0.2" fill="#FFFFFF">CAREER APPLICATION &amp; RECRUITMENT</text>
  <text x="120" y="175.5" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-weight="800" font-size="6.1" letter-spacing="0.2" fill="#FFFFFF">FOR EDUCATION SERVICES</text>

  <!-- apply, evaluate, hire -->
  <g stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" fill="none">
    <path d="M108.5 193 L111.5 193 M128.5 193 L131.5 193"/>
  </g>
  <circle cx="101" cy="193" r="7" fill="#FFFFFF" stroke="#1E6B42" stroke-width="1.4"/>
  <circle cx="120" cy="193" r="7" fill="#FFFFFF" stroke="#1E6B42" stroke-width="1.4"/>
  <circle cx="139" cy="193" r="7" fill="#FFFFFF" stroke="#1E6B42" stroke-width="1.4"/>
  <g fill="none" stroke="#1E6B42" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M98.5 189 L102.5 189 L104 190.5 L104 197 L98.5 197 Z M100 192.5 L102.5 192.5 M100 194.7 L102.5 194.7"/>
    <path d="M116.8 193.2 L119 195.4 L123.4 190.6"/>
    <path d="M135.5 191 L142.5 191 L142.5 196.5 L135.5 196.5 Z M137.5 191 L137.5 189.5 L140.5 189.5 L140.5 191"/>
  </g>
</svg>
